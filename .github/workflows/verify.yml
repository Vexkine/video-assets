name: verify
# Kiem nhat quan kho hinh (manifest, tep, bam, an toan SVG, index/). Xem CONTRIBUTING.md.
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # day du lich su: tools/verify.mjs --changed va kiem trailer commit; kho 66 MB, khong sparse
          lfs: false # anh la con tro LFS: verify doc `oid` de kiem bam, khong can tai ve

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Kiem toan kho
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node tools/verify.mjs --changed "origin/${{ github.base_ref }}"
          else
            node tools/verify.mjs
          fi
